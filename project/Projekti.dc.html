<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="image-slot.js"></script>
<style>body{margin:0;font-family:'Barlow Semi Condensed',sans-serif;color:#111;background:#fff}a{color:#111}a:hover{color:#C11717}*:focus-visible{outline:2px solid #111;outline-offset:2px}</style>
</helmet>
<dc-import name="Header" active="Projekti" hint-size="100%,96px"></dc-import>
<main style="font-family:'Barlow Semi Condensed',sans-serif;max-width:1184px;margin:0 auto;padding:40px clamp(20px,5vw,48px) clamp(64px,9vw,128px);">
  <div style="font-size:14px;color:#575656;margin-bottom:32px;display:flex;gap:8px;"><a href="Home.dc.html" style="color:#575656;">Početna</a><span>/</span><span>Projekti</span></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px 56px;margin-bottom:56px;">
    <h1 style="font-size:clamp(40px,5vw,56px);font-weight:400;line-height:1.08;margin:0;">Projekti</h1>
    <p style="font-size:18px;line-height:1.5;margin:0;text-wrap:pretty;">Više od 7.000 realizovanih projekata u 70 zemalja: od hidroelektrana i autoputeva do poslovnih kompleksa i vodovoda.</p>
  </div>
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:center;border-bottom:1px solid #E1E1E1;padding-bottom:16px;margin-bottom:48px;">
    <div role="tablist" style="display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
        <div style="display:flex;align-items:center;">
          <button role="tab" aria-selected="{{ t.active }}" onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}</button>
          <span style="width:1px;height:18px;background:#C4C4C4;"></span>
        </div>
      </sc-for>
    </div>
    <label style="display:flex;align-items:center;border:1px solid #111;height:48px;padding:0 14px;gap:10px;min-width:min(100%,280px);box-sizing:border-box;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg>
      <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Pretraži projekte" aria-label="Pretraži projekte" style="border:0;outline:none;font-family:inherit;font-size:17px;flex:1;min-width:0;background:transparent;">
    </label>
  </div>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="background:#F2F2F2;padding:56px;text-align:center;">
      <div style="font-size:28px;margin-bottom:8px;">Nema projekata za izabrane kriterijume</div>
      <button onClick="{{ reset }}" style="margin-top:16px;background:#fff;border:2px solid #C11717;padding:14px 24px;font-family:inherit;font-size:18px;cursor:pointer;">Poništi filtere</button>
    </div>
  </sc-if>
  <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:56px 32px;">
    <sc-for list="{{ shown }}" as="p" hint-placeholder-count="5">
      <a href="Projekat.dc.html" style="text-decoration:none;display:block;grid-column:{{ p.span }};">
        <h3 style="font-size:{{ p.fs }};font-weight:400;line-height:1.2;margin:0 0 8px;">{{ p.t }}</h3>
        <div style="display:flex;gap:10px;font-size:14px;color:#575656;margin-bottom:16px;"><span>{{ p.loc }}</span><span style="width:1px;background:#999;"></span><span>{{ p.sec }}</span></div>
        <div style="aspect-ratio:4/3;overflow:hidden;"><image-slot id="{{ p.id }}" placeholder="Fotografija projekta" style="width:100%;height:100%;"></image-slot></div>
      </a>
    </sc-for>
  </div>
  <sc-if value="{{ more }}" hint-placeholder-val="{{ true }}">
    <div style="text-align:center;margin-top:64px;"><button onClick="{{ loadMore }}" style="background:#fff;border:2px solid #C11717;padding:14px 32px;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;" style-hover="background:#F2F2F2;">{{ loadLabel }}</button></div>
  </sc-if>
</main>
<dc-import name="Footer" hint-size="100%,520px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={tab:'Sve',q:'',n:5,loading:false,w:window.innerWidth};
  componentDidMount(){this.r=()=>this.setState({w:window.innerWidth});window.addEventListener('resize',this.r);}
  componentWillUnmount(){window.removeEventListener('resize',this.r);}
  renderVals(){
    const all=[['HE Gornja Drina','BiH','Energetika'],['Autoput Pakovraće – Požega','Srbija','Infrastruktura'],['Poslovni centar Ušće 2','Beograd','Visokogradnja'],['Vodovod Kampala','Uganda','Vodoprivreda'],['Trafostanica Doha South','Katar','Energetika'],['Most preko Save, Obrenovac','Srbija','Infrastruktura'],['Fabrika cementa Novi Popovac','Srbija','Industrija'],['Kosa Kvart','Beograd','Visokogradnja'],['Brana Bujagali','Uganda','Vodoprivreda'],['Aerodrom Lagos – terminal','Nigerija','Visokogradnja']].map(([t,loc,sec],i)=>({t,loc,sec,id:'proj-'+i}));
    const {tab,q,n,w}=this.state;
    const f=all.filter(p=>(tab==='Sve'||p.sec===tab)&&(!q||p.t.toLowerCase().includes(q.toLowerCase())));
    const shown=f.slice(0,n).map((p,i)=>{const big=(i%5)<2;return {...p,span:w<760?'1/-1':(big?'span 3':'span 2'),fs:big?'28px':'24px'};});
    const tabs=['Sve','Energetika','Visokogradnja','Infrastruktura','Vodoprivreda','Industrija'].map(label=>{const a=label===tab;return {label,active:a,onClick:()=>this.setState({tab:label,n:5}),
      style:{background:'none',border:0,fontFamily:'inherit',fontSize:'17px',padding:'10px 16px',minHeight:'44px',cursor:'pointer',color:'#111',fontWeight:a?500:400,textDecoration:a?'underline':'none',textDecorationColor:'#C11717',textDecorationThickness:'2px',textUnderlineOffset:'8px'}};});
    return {tabs,shown,q,empty:!f.length,more:f.length>n,loadLabel:this.state.loading?'Učitavanje…':'Učitaj još',
      onQ:e=>this.setState({q:e.target.value}),reset:()=>this.setState({tab:'Sve',q:''}),
      loadMore:()=>{this.setState({loading:true});setTimeout(()=>this.setState({loading:false,n:n+5}),600);}};
  }
}
</script>
</body>
</html>
